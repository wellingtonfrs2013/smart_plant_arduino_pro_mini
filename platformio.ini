[env:pro16MHzatmega328]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
lib_deps = -
	adafruit/RTClib@^2.1.4
	marlinfirmware/U8glib-HAL@^0.5.5
	adafruit/DHT sensor library@^1.4.7



